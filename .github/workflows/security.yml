name: Security

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_call:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability checks
        run: govulncheck ./...

      - name: Install nancy for SCA
        run: go install github.com/sonatype-nexus-community/nancy@latest

      - name: Run nancy scan
        run: go list -json ./... | nancy sleuth --output json --output-file nancy-report.json
        continue-on-error: true

      - name: Upload nancy report
        uses: actions/upload-artifact@v3
        with:
          name: nancy-vulnerability-report
          path: nancy-report.json
        if: always()

  gosec-scan:
    name: Gosec Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt json -out results.json ./...'
        continue-on-error: true

      - name: Upload Gosec report
        uses: actions/upload-artifact@v3
        with:
          name: gosec-security-report
          path: results.json
        if: always()

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Audit dependencies
        run: go mod audit
        continue-on-error: true

      - name: Check for outdated dependencies
        run: |
          go list -u -m all | grep -i upgrade || echo "All dependencies are up to date"
        continue-on-error: true

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: go-licenses check ./infra/broker/...
        continue-on-error: true

      - name: Generate license report
        run: go-licenses report ./infra/broker/... > licenses-report.txt
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v3
        with:
          name: licenses-report
          path: licenses-report.txt
        if: always()
