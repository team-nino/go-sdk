name: Code Quality

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Check cyclomatic complexity
        run: |
          RESULT=$(gocyclo -over 15 ./...)
          if [ -n "$RESULT" ]; then
            echo "Functions with high cyclomatic complexity:"
            echo "$RESULT"
          else
            echo "All functions have acceptable complexity"
          fi
        continue-on-error: true

  coverage-check:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage is below 60%"
            exit 1
          fi
          echo "Coverage meets minimum threshold"
        continue-on-error: true

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.html
        if: always()

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Check for undocumented exports
        run: |
          go install github.com/client9/misspell/cmd/misspell@latest
          for file in $(find . -name "*.go" -type f); do
            misspell "$file" || true
          done
        continue-on-error: true

      - name: Verify examples compile
        run: go test -v -run Example ./...
        continue-on-error: true

  module-check:
    name: Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Tidy and check for drift
        run: |
          go mod tidy
          if git diff --quiet go.mod go.sum; then
            echo "go.mod and go.sum are in sync"
          else
            echo "go.mod and go.sum are out of sync"
            git diff go.mod go.sum
            exit 1
          fi
