name: Lint

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --out-format=github-actions

      - name: Check code formatting
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            gofmt -s -d .
            exit 1
          fi
          echo "All files are properly formatted"

      - name: Check imports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          UNIMPORTED=$(goimports -l .)
          if [ -n "$UNIMPORTED" ]; then
            echo "Files with unorganized imports:"
            echo "$UNIMPORTED"
            goimports -d .
            exit 1
          fi
          echo "All imports are properly organized"

      - name: go vet
        run: go vet -v ./...

      - name: Detect unused code
        run: |
          go install github.com/golangci/unused@latest
          unused ./...
        continue-on-error: true

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
